listeners:
  - name: main-tcp
    address: 127.0.0.1:4000

    routing:
      type: tls
      rules:
        - cluster: web
          host: "*.example.com"
      
clusters:
  - name: web
    lb: sticky
    backends:
      - address: 127.0.0.1:8080
      - address: 127.0.0.1:8081
      - address: 127.0.0.1:8082

  